# Sobe o banco de dados (PostgreSQL) e o Redis para desenvolvimento local.
# Uso: rode "docker compose up -d" na raiz do projeto (com o Docker Desktop aberto).
services:
  postgres:
    image: postgres:15
    container_name: copilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: copilot
      POSTGRES_PASSWORD: copilot123
      POSTGRES_DB: marketplace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: copilot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  pgdata:
